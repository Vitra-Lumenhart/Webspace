const EDGES=[['entry','lantern'],['lantern','balcony'],['balcony','ramp1'],['ramp1','ramp2'],['ramp2','bazaar'],['bazaar','cross'],['bazaar','broken'],['cross','names'],['cross','broken'],['cross','fortunes'],['cross','commons'],['names','fortunes'],['names','homeRamp'],['broken','arts'],['arts','commons'],['arts','court'],['fortunes','commons'],['fortunes','quiet'],['commons','court'],['commons','quiet'],['court','exit'],['quiet','quays'],['quays','exit'],['quiet','homeRamp'],['homeRamp','homes'],['homes','homeBridge'],['homeBridge','balcony']];

function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
// Generate visible architecture from epochs; fixed circulation is not randomized.
function generate(seed=365){const r=rng(seed),buildings=[];let i=0;for(const side of [-1,1])for(let tier=0;tier<3;tier++)for(let j=0;j<12;j++){const x=side*(47+tier*12+r()*6),z=-64+j*11+r()*3,y=tier*19+(side>0?-2:0);const w=7+r()*5,d=8+r()*4,h=6+r()*7;buildings.push({id:'b'+i++,x,y,z,w,d,h,side,tier,epoch:tier+2,kind:['clinger','stacker','burrower','engulfer'][Math.floor(r()*4)],palette:Math.floor(r()*6),roof:r()>.45,windows:2+Math.floor(r()*3)});}return buildings;}
const DISTRICT=['bazaar','cross','names','broken','arts','fortunes','commons','court','quiet','quays'];

 rivalTick(t);if(t.outcome==='active'){const close=frameRadius(t)===1;t.pressure=t.guard||!close?0:(t.pressure||0)+1;if(t.pressure>=4){t.half=null;t.outcome='tagged';t.trace.push('The rival reaches practice-tag range. Your fictional purse stays yours.');}}if(t.round>=12&&t.outcome==='active'){t.half=null;t.outcome='left';t.trace.push('Practice frame ends; no loss.');}return t;}

];

function crowdPosition(a,t){const p=(t*a.speed+a.phase)%1;const u=(1-Math.cos(p*Math.PI*2))/2;return [a.x+(a.tx-a.x)*u,a.y||0,a.z+(a.tz-a.z)*u];}
function makeCrowd(seed=1701){const r=rng(seed),out=[];for(let i=0;i<36;i++){let edge=EDGES.filter(([a,b])=>byId[a].y===0&&byId[b].y===0&&!['exit'].includes(a)&&!['exit'].includes(b))[i%14];if(!edge)continue;let a=byId[edge[0]],b=byId[edge[1]],dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz),side=(i%2?1:-1)*(1.45+r()*.6),x=a.x-dz/len*side,z=a.z+dx/len*side;out.push({id:'walker'+i,x,z,tx:b.x-dz/len*side,tz:b.z+dx/len*side,speed:(.6+r()*.8)/(2*len),phase:r(),height:1.48+r()*.42,palette:i%6});}// Additional local shoppers milling around the Bazaar frontage, not a second population for the same actors.
for(let i=0;i<24;i++){const a=byId.bazaar,b=byId.cross,dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz),u=.08+r()*.84,side=(i%2?1:-1)*(1.1+r()*1.0),x=a.x+dx*u-dz/len*side,z=a.z+dz*u+dx/len*side,dist=1+r()*2.8;out.push({id:'shopper'+i,x,z,tx:x+dx/len*dist,tz:z+dz/len*dist,speed:.08+r()*.10,phase:r(),height:1.4+r()*.48,palette:i%6});}return out;}

function moveTo(id){if(travel||!neighbors(current).includes(id)||enc?.outcome==='active')return;const from=eye.slice(),to=pos(id);travel={from,to,id,elapsed:0,duration:Math.max(900,edgeLength(current,id)*190),paused:false};refresh();}
let lastOffer=-Infinity,lastAudio=0,lastCaption=-Infinity,captionIndex=0;
function anim(now){let dt=Math.min(100,Math.max(0,now-last));if(travel&&!travel.paused){travel.elapsed+=dt;const s=walkSample(travel.from,travel.to,travel.elapsed,travel.duration);eye=s.eye;if(s.done){current=travel.id;travel=null;refresh();}}draw(eye,yaw,pitch,now);if(now-lastOffer>100){updateOffers(now);lastOffer=now;}if(now-lastAudio>120){audioTick(eye,yaw,now);lastAudio=now;}last=now;requestAnimationFrame(anim);}
function togglePause(){if(!travel)return;travel.paused=!travel.paused;$('pause').textContent=travel.paused?'Resume walk':'Pause walk';$('routeNote').textContent=travel.paused?'Paused in the street':'Walking · look freely';}
const offerButtons=new Map();
function updateOffers(now){const found=attentionAt(eye,yaw,pitch);const w=canvas.clientWidth,h=canvas.clientHeight;const seen=new Set();for(const o of found.filter(a=>a.facing>.35&&a.distance<26).slice(0,4)){const xy=projectWorld([o.x,o.y+3.65,o.z+1.48],eye,yaw,pitch);if(!xy||xy[0]<65||xy[0]>w-65||xy[1]<65||xy[1]>h-145)continue;seen.add(o.id);let b=offerButtons.get(o.id);if(!b){b=document.createElement('button');b.textContent=o.sign;b.onclick=()=>{$('offerTitle').textContent=o.sign;$('offerText').textContent=o.detail;$('offerDetail').hidden=false;};offerButtons.set(o.id,b);$('offers').append(b);}b.style.left=xy[0]+'px';b.style.top=xy[1]+'px';}for(const [id,b] of offerButtons){if(!seen.has(id)){b.remove();offerButtons.delete(id);}}if(now-lastCaption>3900){lastCaption=now;const near=found.filter(a=>a.distance<20&&a.call);const audible=near.length?near[captionIndex++%near.length]:null;$('captionLine').textContent=audible?'“'+audible.call+'”':'';if(audible&&now>nextVoice){nextVoice=now+6500;voiceCall(audible.call,audible.distance);}}if(!found.some(a=>a.distance<20&&a.call))$('captionLine').textContent='';}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const lore={lantern:'Keeper of the Last Lantern · “Sit. You needn’t have a reason.”',bazaar:'The Instrument Nobody Wanted · a discarded instrument may find a second life.',names:'Merchant of Unchosen Faces · “Would you rather be recognized, or introduced?”',broken:'Mara of the Second Spring · “It has not finished being useful.”',arts:'Professor Venn · “That is a lovely mistake. May I keep the drawing?”',commons:'A meal, a favor, a lesson. The market is not only for people with money.',court:'The books may balance without settling who is owed.',quays:'Orren Blackwake · “Tell me the bad news while I can still do something.”',quiet:'Low-stimulus participation: blue lamps, quiet conversation, no compulsory disclosure.',homes:'Commerce happens because people live here.',fortunes:'The most beautiful room is reserved for no-fee demonstrations.'};
function refresh(){let n=byId[current];$('place').textContent=n.name;$('desc').textContent=n.desc;$('lore').textContent=lore[current]||'';$('routes').innerHTML='';const routeList=neighbors(current);for(let id of routeList){const b=document.createElement('button');b.textContent=byId[id].name;b.disabled=!!travel||enc?.outcome==='active';b.onclick=()=>moveTo(id);$('routes').append(b);}$('pause').disabled=!travel;$('pause').textContent=travel?.paused?'Resume walk':'Pause walk';$('routeNote').textContent=travel?'Walking · look freely':`${routeList.length} connected paths · arrow buttons choose local routes`;$('practice').disabled=!!travel||!DISTRICT.includes(current)||enc?.outcome==='active';renderEncounter();renderMap();}
function renderMap(){const ns='http://www.w3.org/2000/svg',svg=$('map');svg.replaceChildren();const pt=n=>[100+n.x*1.05,106-n.z*1.05];function el(tag,attrs){let e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);svg.append(e);return e;}for(const [a,b] of EDGES){let p=pt(byId[a]),q=pt(byId[b]);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#a6977455','stroke-width':1.5});}for(const n of NODES){let p=pt(n);el('circle',{cx:p[0],cy:p[1],r:n.id===current?5:2.8,fill:n.id===current?'#f6d695':n.y>10?'#9cbece':'#b5a58d'});}if(enc?.outcome==='active'){let n=byId[enc.rival],p=pt(n);el('circle',{cx:p[0],cy:p[1],r:5,fill:'none',stroke:'#dc7b91','stroke-width':2});} }
function renderEncounter(){let p=$('enc');p.hidden=!enc;if(!enc)return;let s=enc;$('encTitle').textContent=s.outcome==='active'?'Xenos • civic practice':s.outcome==='evaded'?'Evaded · safe anchor reached':s.outcome==='tagged'?'Tagged · fictional practice loss':'Practice ended safely';$('encStatus').textContent=s.outcome==='active'?`Round ${s.round}/12 · ${s.half?'half-edge, choose continuation or retreat':'anchor '+byId[s.player].name} · pressure ${byId[s.rival].name} · radius ${frameRadius(s)} · exposure ${s.pressure}/4${blocked(s)?' · anticipated node unavailable: '+byId[blocked(s)].name:''}`:'Your fictional purse remains yours. No bank effects.';$('trace').textContent=s.trace.slice(-3).join(' / ');$('actions').replaceChildren();for(const a of choices(s)){let b=document.createElement('button');b.textContent=a.startsWith('move:')?'Half step · '+byId[a.slice(5)].name:({continue:'Complete edge',retreat:'Return to anchor',guard:'Guard purse',leave:'Leave encounter'}[a]);b.onclick=()=>{const next=step(enc,a);if(!next)return;enc=next;current=enc.player;if(enc.half){let aa=pos(enc.half.from),bb=pos(enc.half.to);eye=aa.map((v,i)=>(v+bb[i])/2);}else{eye=pos(current);}refresh();};$('actions').append(b);}if(s.outcome==='active'&&blocked(s)){let t=alternative(s,blocked(s));if(t)$('trace').textContent+=' · Alternative: '+byId[t].name;}if(s.outcome!=='active'){let b=document.createElement('button');b.textContent='Close practice';b.onclick=()=>{enc=null;refresh();};$('actions').append(b);}}
$('atlas').onclick=()=>{let open=$('stage').classList.toggle('atlas');$('atlas').setAttribute('aria-expanded',String(open));};$('sound').onclick=async()=>{let enabled=await toggleSound();$('sound').textContent=enabled?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(enabled));};$('pause').onclick=togglePause;$('dismissOffer').onclick=()=>{$('offerDetail').hidden=true;};$('practice').onclick=()=>{enc=beginEncounter(current);refresh();};$('recenter').onclick=()=>setView(current);$('reset').onclick=()=>{enc=null;travel=null;current='entry';eye=pos(current);setView(current);refresh();};$('reveal').onclick=()=>{if(current==='entry'&&!travel)moveTo('lantern');else if(current==='lantern'&&!travel)moveTo('balcony');};
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.005;pitch=Math.max(-1.18,Math.min(1.18,pitch-(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];});for(let e of ['pointerup','pointercancel'])canvas.addEventListener(e,()=>drag=null);
function directed(){return neighbors(current).sort((a,b)=>{const score=id=>{let n=byId[id],p=byId[current],d=norm([n.x-p.x,0,n.z-p.z]);return d[0]*Math.sin(yaw)-d[2]*Math.cos(yaw);};return score(b)-score(a);});}
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='A'){if(e.key===' '||e.key==='Enter')return;}if(e.key===' '&&travel){e.preventDefault();togglePause();return;}if(e.key==='m'||e.key==='M'){$('atlas').click();return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','Escape'].includes(e.key))e.preventDefault();if(e.key==='a'||e.key==='ArrowLeft')yaw-=.2;if(e.key==='d'||e.key==='ArrowRight')yaw+=.2;if(e.key==='w'||e.key==='ArrowUp'){let dest=directed()[0];if(dest)moveTo(dest);}if(e.key==='s'||e.key==='ArrowDown'){let dest=directed().at(-1);if(dest)moveTo(dest);}if(e.key==='Escape'&&enc?.outcome==='active'){$('actions').lastElementChild?.click();}});
setView(current);refresh();requestAnimationFrame(anim);window.__thousand={get state(){return {current,travel:!!travel,paused:!!travel?.paused,yaw,pitch,eye:eye.slice(),offers:offerButtons.size,walkers:walkers.length,soundEnabled,enc,vertices:staticMesh.count,buildings:buildings.length,glError:gl.getError()};}};

}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent='The scene could not initialize: '+e.message;console.error(e);}</script></body></html>
