// Belowroads index.template.html field() lineage @ 6908912: ellipse air, broad relief,
// protected route and boundary search. No 3-D voxel field or marching tetrahedra.
const CAVE_SEG=64,CAVE_RINGS=[[-10,1],[0,1],[16,1.01],[35,1.045],[54,1.05],[72,.95],[88,.76],[101,.46],[110,.035]];
function rootField(fn,lo,hi){for(let k=0;k<12;k++){let m=(lo+hi)/2;if(fn(m)>0)lo=m;else hi=m;}return (lo+hi)/2;}
function domeRadius(a,k){const [y,s]=CAVE_RINGS[k],r=92*s;return rootField(d=>r-d+Math.min(3,r*.12)*(.60*Math.sin(a*7+y*.11)*Math.sin(a*4-y*.15)+.40*Math.sin(a*13+y*.25)),0,r+5);}
function tubeProfile(s){let t=Math.max(0,Math.min(1,s/15));return {w:4.3+4.9*t*t,h:4.5+4.6*t*t,c:.65*Math.sin(t*Math.PI)};}
function tubeField(x,y,s){let p=tubeProfile(s),dx=x-p.c;let air=(1-Math.hypot(dx/p.w,y/p.h))*Math.min(p.w,p.h)+.34*Math.sin(x*1.26+y*.71+s*.84)*Math.sin(s*.78-y*.93)+.12*Math.sin(x*2.2+y*2.9+s*1.5);return Math.max(air,Math.min(2.4-Math.abs(dx),3.1-y));}
function tubeSection(s,a){let p=tubeProfile(s),r=rootField(d=>tubeField(p.c+Math.cos(a)*d,Math.sin(a)*d,s),0,14);return [p.c+Math.cos(a)*r,Math.sin(a)*r];}

const SCREEN_COPY={'neon-orchard':['Neon Orchard','Nella Voss · ordinary fruit, extraordinary advertising. The peaches are a harmless holographic display.','Ask about a bowl','Fresh-cut fruit is available in this fictional shop. No order or credits transferred.'], 'haven-leatherworks':['Haven Leatherworks','Independent leather craft. Screen commissioned from the technology minority.','Inspect craftsmanship','A bag can be repaired rather than replaced. No purchase made.'], 'second-print':['Second Print','Paid fictional civic advertisement. The poster makes allegations; they are not established facts or a ruling.','Read the notice','No vote recorded. Independent evidence and competing views belong at the Court of Many Promises.'], 'lucky-draw':['Lucky Draw','Fictional arcade promotion. No stakes, no automatic encounter.','Inspect rules','The screen is a display, not an active draw or reward system in this build.']};
function inspectScreen(id){const s=SCREENS.find(x=>x.id===id),c=SCREEN_COPY[id];if(!s||!c)return;const img=$('screenPreview');img.hidden=false;img.style.backgroundImage='url('+SCREEN_ATLAS+')';img.style.backgroundPosition=(s.slot%2?'100%':'0%')+' '+(s.slot>=2?'100%':'0%');$('offerTitle').textContent=c[0];$('offerText').textContent=c[1];$('screenAction').hidden=false;$('screenAction').textContent=c[2];$('screenAction').onclick=()=>{$('offerText').textContent=c[3];};$('offerDetail').hidden=false;}
function screenHit(x,y){const w=canvas.clientWidth,h=canvas.clientHeight,f=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)],right=[Math.cos(yaw),0,Math.sin(yaw)],up=[-Math.sin(yaw)*Math.sin(pitch),Math.cos(pitch),Math.cos(yaw)*Math.sin(pitch)],sx=(x-w/2)*2*Math.tan(1.11/2)/h,sy=(h/2-y)*2*Math.tan(1.11/2)/h,d=f.map((v,i)=>v+right[i]*sx+up[i]*sy);let best=null;for(const s of SCREENS){if(d[2]>=-.001||eye[2]<=s.z)continue;let t=(s.z+.027-eye[2])/d[2];if(t<=0||t>24)continue;let X=eye[0]+d[0]*t,Y=eye[1]+d[1]*t;if(Math.abs(X-s.x)<=s.w/2&&Y>=s.y&&Y<=s.y+s.h&&(!best||t<best.t))best={id:s.id,t};}return best?.id;}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const lore={lantern:'Keeper of the Last Lantern · “Sit. You needn’t have a reason.”',bazaar:'The Instrument Nobody Wanted · a discarded instrument may find a second life.',names:'Merchant of Unchosen Faces · “Would you rather be recognized, or introduced?”',broken:'Mara of the Second Spring · “It has not finished being useful.”',arts:'Professor Venn · “That is a lovely mistake. May I keep the drawing?”',commons:'A meal, a favor, a lesson. The market is not only for people with money.',court:'The books may balance without settling who is owed.',quays:'Orren Blackwake · “Tell me the bad news while I can still do something.”',quiet:'Low-stimulus participation: blue lamps, quiet conversation, no compulsory disclosure.',homes:'Commerce happens because people live here.',fortunes:'The most beautiful room is reserved for no-fee demonstrations.'};
function refresh(){let n=byId[current];$('place').textContent=n.name;$('desc').textContent=n.desc;$('lore').textContent=lore[current]||'';$('routes').innerHTML='';const routeList=neighbors(current);for(let id of routeList){const b=document.createElement('button');b.textContent=byId[id].name;b.disabled=!!travel||enc?.outcome==='active';b.onclick=()=>moveTo(id);$('routes').append(b);}$('pause').disabled=!travel;$('pause').textContent=travel?.paused?'Resume walk':'Pause walk';$('cultureNote').textContent='Residents: '+CULTURES.map(c=>c.id+' '+c.count).join(' · ');$('routeNote').textContent=travel?'Walking · look freely':`${routeList.length} connected paths · arrow buttons choose local routes`;$('practice').disabled=!!travel||!DISTRICT.includes(current)||enc?.outcome==='active';renderEncounter();renderMap();}
function renderMap(){const ns='http://www.w3.org/2000/svg',svg=$('map');svg.replaceChildren();const pt=n=>[100+n.x*1.05,106-n.z*1.05];function el(tag,attrs){let e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);svg.append(e);return e;}for(const [a,b] of EDGES){let p=pt(byId[a]),q=pt(byId[b]);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#a6977455','stroke-width':1.5});}for(const n of NODES){let p=pt(n);el('circle',{cx:p[0],cy:p[1],r:n.id===current?5:2.8,fill:n.id===current?'#f6d695':n.y>10?'#9cbece':'#b5a58d'});}if(enc?.outcome==='active'){let n=byId[enc.rival],p=pt(n);el('circle',{cx:p[0],cy:p[1],r:5,fill:'none',stroke:'#dc7b91','stroke-width':2});} }
function renderEncounter(){let p=$('enc');p.hidden=!enc;if(!enc)return;let s=enc;$('encTitle').textContent=s.outcome==='active'?'Xenos • civic practice':s.outcome==='evaded'?'Evaded · safe anchor reached':s.outcome==='tagged'?'Tagged · fictional practice loss':'Practice ended safely';$('encStatus').textContent=s.outcome==='active'?`Round ${s.round}/12 · ${s.half?'half-edge, choose continuation or retreat':'anchor '+byId[s.player].name} · pressure ${byId[s.rival].name} · radius ${frameRadius(s)} · exposure ${s.pressure}/4${blocked(s)?' · anticipated node unavailable: '+byId[blocked(s)].name:''}`:'Your fictional purse remains yours. No bank effects.';$('trace').textContent=s.trace.slice(-3).join(' / ');$('actions').replaceChildren();for(const a of choices(s)){let b=document.createElement('button');b.textContent=a.startsWith('move:')?'Half step · '+byId[a.slice(5)].name:({continue:'Complete edge',retreat:'Return to anchor',guard:'Guard purse',leave:'Leave encounter'}[a]);b.onclick=()=>{const next=step(enc,a);if(!next)return;enc=next;current=enc.player;if(enc.half){let aa=pos(enc.half.from),bb=pos(enc.half.to);eye=aa.map((v,i)=>(v+bb[i])/2);}else{eye=pos(current);}refresh();};$('actions').append(b);}if(s.outcome==='active'&&blocked(s)){let t=alternative(s,blocked(s));if(t)$('trace').textContent+=' · Alternative: '+byId[t].name;}if(s.outcome!=='active'){let b=document.createElement('button');b.textContent='Close practice';b.onclick=()=>{enc=null;refresh();};$('actions').append(b);}}
$('atlas').onclick=()=>{let open=$('stage').classList.toggle('atlas');$('atlas').setAttribute('aria-expanded',String(open));};$('sound').onclick=async()=>{let enabled=await toggleSound();$('sound').textContent=enabled?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(enabled));};$('pause').onclick=togglePause;$('dismissOffer').onclick=()=>{$('offerDetail').hidden=true;};$('practice').onclick=()=>{enc=beginEncounter(current);refresh();};$('recenter').onclick=()=>setView(current);$('reset').onclick=()=>{enc=null;travel=null;current='entry';eye=pos(current);setView(current);refresh();};$('reveal').onclick=()=>{if(current==='entry'&&!travel)moveTo('lantern');else if(current==='lantern'&&!travel)moveTo('balcony');};
let pointerStart=null;canvas.addEventListener('pointerdown',e=>{pointerStart=[e.clientX,e.clientY];drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.005;pitch=Math.max(-1.18,Math.min(1.18,pitch-(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];});canvas.addEventListener('pointerup',e=>{if(pointerStart&&Math.hypot(e.clientX-pointerStart[0],e.clientY-pointerStart[1])<5){const r=canvas.getBoundingClientRect(),id=screenHit(e.clientX-r.left,e.clientY-r.top);if(id)inspectScreen(id);}drag=null;pointerStart=null;});canvas.addEventListener('pointercancel',()=>{drag=null;pointerStart=null;});
function directed(){return neighbors(current).sort((a,b)=>{const score=id=>{let n=byId[id],p=byId[current],d=norm([n.x-p.x,0,n.z-p.z]);return d[0]*Math.sin(yaw)-d[2]*Math.cos(yaw);};return score(b)-score(a);});}
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='A'){if(e.key===' '||e.key==='Enter')return;}if(e.key===' '&&travel){e.preventDefault();togglePause();return;}if(e.key==='m'||e.key==='M'){$('atlas').click();return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','Escape'].includes(e.key))e.preventDefault();if(e.key==='a'||e.key==='ArrowLeft')yaw-=.2;if(e.key==='d'||e.key==='ArrowRight')yaw+=.2;if(e.key==='w'||e.key==='ArrowUp'){let dest=directed()[0];if(dest)moveTo(dest);}if(e.key==='s'||e.key==='ArrowDown'){let dest=directed().at(-1);if(dest)moveTo(dest);}if(e.key==='Escape'&&enc?.outcome==='active'){$('actions').lastElementChild?.click();}});
setView(current);refresh();requestAnimationFrame(anim);window.__thousand={get state(){return {current,travel:!!travel,paused:!!travel?.paused,yaw,pitch,eye:eye.slice(),offers:offerButtons.size,walkers:walkers.length,soundEnabled,enc,vertices:staticMesh.count,buildings:buildings.length,renderer:software?"CPU Canvas2D":"WebGL2",frames:software?softFrame:undefined,glError:gl.getError()};}};
