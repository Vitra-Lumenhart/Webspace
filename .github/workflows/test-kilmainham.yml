name: Kilmainham playable WebGL2
on:
  pull_request:
    paths:
      - 'worlds/kaykit-kilmainham/**'
      - '.github/workflows/test-kilmainham.yml'
  push:
    branches: [main]
    paths: ['worlds/kaykit-kilmainham/**']
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check worlds/kaykit-kilmainham/game.mjs
          node worlds/kaykit-kilmainham/test-layout.mjs
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          node worlds/kaykit-kilmainham/test-browser.mjs
