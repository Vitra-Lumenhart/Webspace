name: Webspace immutable versioned source releases
# This file retains its historical v7 path, but is version-aware from v8 onward.
on:
  push:
    branches: [main]
    paths:
      - VERSION.json
      - worlds/elisium/**
      - .github/workflows/release-v7.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive checked release version from VERSION.json
        id: version
        run: |
          python3 - <<'PY'
          import json,os
          data=json.load(open('VERSION.json',encoding='utf8'))
          n=data.get('version_integer')
          assert type(n) is int and 7 <= n <= 9999, 'Expected a valid published integer release (v7+)'
          assert data.get('entry') == 'index.html', 'Missing canonical entry'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
              f.write(f'number={n}\n')
              f.write(f'tag=webspace/v{n:04d}\n')
              f.write(f'filename=Webspace_v{n}_source.zip\n')
          print('Version',n,'validated; historical release tags are immutable')
          PY
      - name: Archive complete canonical source
        run: |
          set -euo pipefail
          git archive --format=zip --output="${{ steps.version.outputs.filename }}" HEAD
          unzip -t "${{ steps.version.outputs.filename }}" | tail -1
      - name: Publish immutable source release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.version.outputs.filename }}
          N: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing $TAG is immutable and was not rewritten."
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "Webspace v$N — Immutable Source Snapshot" \
              --notes "Complete Webspace source and history as of commit $GITHUB_SHA. This source release is distinct from the separately verified public Pages mirror; all narrative, asset and deployment caveats remain in README.md and TECH_MANUAL.html."
          fi
